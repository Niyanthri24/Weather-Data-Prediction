name: Weather alerts

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes, at :07 and :37 (UTC)
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write             # lets the job commit the readings back to the repo

concurrency:
  group: weather-alerts       # never run two collections at the same time
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Fetch weather and send alerts
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          CITIES: "Kolkata,Mumbai,Chennai,Jaipur"
          TEMP_LIMIT_C: "30"
        run: python3 weather_alerts.py

      - name: Save readings to the repo
        if: always()            # keep the readings we did get, even if one city failed
        run: |
          [ -f data/weather_data.csv ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather_data.csv
          git diff --cached --quiet && exit 0
          git commit -m "Add weather readings"
          git pull --rebase
          git push
